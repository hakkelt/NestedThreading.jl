name: TagBot

# Creates the GitHub release and git tag once a new version is merged into the General
# registry. `workflow_dispatch` is there so a missed release can be re-run by hand.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        description: How many days back to look for missed releases
        default: '3'
        required: false

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    # Only react to the registry bot's comments, never to arbitrary issue comments.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Lets TagBot trigger a docs build for the tagged version; harmless if unset.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
