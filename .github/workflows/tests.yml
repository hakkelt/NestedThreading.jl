name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1']
        os: [ubuntu-latest, windows-latest, macOS-latest]

    env:
      JULIA_NUM_THREADS: 4

    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Instrumentation costs time and only one leg is uploaded, so collect it there.
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.julia-version == '1' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          # Both the package and its extensions; the default already covers these, but the
          # extensions carry real logic (the NFFT boolean mapping, the Polyester guard) and
          # dropping them from coverage silently would be easy to miss.
          directories: src,ext
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # `capacity() == 1` collapses "restricted" and "full throttle" onto the same budget, which
  # is a genuinely different code path for every all-or-nothing pool — it is where the NFFT
  # boolean mapping was found not to round-trip. The main matrix runs at 4 threads, so this
  # regime needs a job of its own.
  single-thread:
    name: Single-threaded session
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 1
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # The extensions must activate when their weakdeps are present and stay inert when they
  # are not; the default test environment has all of them, so the bare case needs its own job.
  bare:
    name: No weakdeps loaded
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test with LinearAlgebra only
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            using NestedThreading, LinearAlgebra
            NT = NestedThreading
            @assert [p.name for p in NT.COUNTED_POOLS] == [:blas]
            @assert isempty(NT.GUARDED_POOLS)
            @assert Base.get_extension(NestedThreading, :NestedThreadingFFTWExt) === nothing
            @assert Base.get_extension(NestedThreading, :NestedThreadingPolyesterExt) === nothing
            original = BLAS.get_num_threads()
            NT.with_restricted_threads() do
                @assert BLAS.get_num_threads() == 1
            end
            @assert BLAS.get_num_threads() == original
            println("bare-environment checks passed")
          '

  # MKL_jll ships no artifact for macOS or any non-x86_64 platform, so this cannot live in
  # the shared test/Project.toml (instantiating it would break every macOS job). It gets its
  # own job on the platforms MKL actually supports instead.
  mkl:
    name: MKL pool - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Test MKL extension
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.add("MKL")
            using NestedThreading, MKL
            NT = NestedThreading
            @assert Base.get_extension(NestedThreading, :NestedThreadingMKLExt) !== nothing
            @assert :mkl in [p.name for p in NT.COUNTED_POOLS]
            original = MKL.get_num_threads()
            NT.with_thread_budget(2) do
                @assert MKL.get_num_threads() == 2
            end
            @assert MKL.get_num_threads() == original
            println("MKL extension checks passed")
          '
